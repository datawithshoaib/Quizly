# Render Blueprint for the Quizly FastAPI backend.
# Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: quizly-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      # Use Render's Python instead of letting uv download one into a cache
      # that isn't kept between build and runtime.
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: ENVIRONMENT
        value: production
      # Your Vercel URL, e.g. https://quizly.vercel.app (comma-separate several).
      - key: FRONTEND_ORIGIN
        sync: false
      # Optional: allow Vercel preview deployments, e.g. https://quizly-.*\.vercel\.app
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
      # SQLite lives on Render's ephemeral disk and is reset on every deploy/restart.
      # Set a Postgres URL here for persistent storage.
      - key: DATABASE_URL
        value: sqlite:///./quizly.db
