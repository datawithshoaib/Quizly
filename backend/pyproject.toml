[project]
name = "quizly-backend"
version = "0.1.0"
description = "Quizly FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-deepseek>=1.1.1,<2.0.0",
    "langchain-google-genai>=4.4.0,<5.0.0",
    "langchain-huggingface>=1.2.3,<2.0.0",
    "langchain-openrouter>=0.2.8,<1.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30.0",
]
